? ''
:   conda_opensll_cert_file_set: '1'
admins: []
api:
    extra_webhook_prefix: ''
    port: 5300
    public_base_url: https://bouncy-strobe-kilobyte.ngrok-free.dev
    webhook_prefix: https://bouncy-strobe-kilobyte.ngrok-free.dev
command:
    enable: true
    prefix:
    - '!'
    - ！
    privilege: {}
concurrency:
    pipeline: 20
    session: 1
database:
    postgresql:
        database: postgres
        host: 127.0.0.1
        password: ''
        port: 5432
        user: postgres
    sqlite:
        path: data/langbot.db
    use: sqlite
monitoring:
    auto_cleanup:
        check_interval_hours: 1
        delete_batch_size: 1000
        enabled: true
        retention_days: 30
plugin:
    binary_storage:
        max_value_bytes: 10485760
    display_plugin_debug_url: ws://localhost:5401/plugin/debug/ws
    enable: true
    enable_marketplace: true
    runtime_ws_url: ws://langbot_plugin_runtime:5400/control/ws
proxy:
    http: ''
    https: ''
sales:
    radar_public_base_url: http://127.0.0.1:5300
space:
    disable_models_service: true
    disable_telemetry: false
    models_gateway_api_url: https://api.langbot.cloud/v1
    oauth_authorize_url: https://space.langbot.app/auth/authorize
    url: https://space.langbot.app
storage:
    cleanup:
        check_interval_hours: 1
        enabled: true
        log_retention_days: 3
        uploaded_file_retention_days: 7
    s3:
        access_key_id: ''
        bucket: langbot-storage
        endpoint_url: ''
        region: us-east-1
        secret_access_key: ''
    use: local
system:
    allow_modify_login_info: true
    disabled_adapters: []
    edition: community
    instance_id: ''
    jwt:
        expire: 604800
        secret: ea3826b50e78d17ea146d8ee6faa3a3a
    limitation:
        max_bots: -1
        max_extensions: -1
        max_pipelines: -1
    recovery_key: 5AE3C3
    task_retention:
        completed_limit: 200
vdb:
    milvus:
        db_name: ''
        token: ''
        uri: http://127.0.0.1:19530
    pgvector:
        database: langbot
        host: 127.0.0.1
        password: ''
        port: 5433
        user: postgres
    qdrant:
        api_key: ''
        host: localhost
        port: 6333
        url: ''
    seekdb:
        database: langbot
        host: localhost
        mode: embedded
        password: ''
        path: ./data/seekdb
        port: 2881
        tenant: ''
        user: root
    use: chroma
