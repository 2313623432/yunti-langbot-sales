apiVersion: v1
kind: LLMAPIRequester
metadata:
  name: builtin-pdf-parse
  label:
    en_US: Built-in PDF Parse
    zh_Hans: 内置 PDF 解析
  icon: openai.svg
spec:
  config:
  - name: base_url
    label:
      en_US: Base URL
      zh_Hans: 基础 URL
    type: string
    required: false
    default: local://pdf
  support_type:
  - pdf-parse
  provider_category: builtin
execution:
  python:
    path: ./catalog_requester.py
    attr: BuiltinPdfParseRequester
