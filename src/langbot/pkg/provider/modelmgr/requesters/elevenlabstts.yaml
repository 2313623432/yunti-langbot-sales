apiVersion: v1
kind: LLMAPIRequester
metadata:
  name: elevenlabs-tts
  label:
    en_US: ElevenLabs
    zh_Hans: ElevenLabs
  icon: elevenlabs.svg
spec:
  config:
  - name: base_url
    label:
      en_US: Base URL
      zh_Hans: 基础 URL
    type: string
    required: true
    default: https://api.elevenlabs.io/v1
  - name: timeout
    label:
      en_US: Timeout
      zh_Hans: 超时时间
    type: integer
    required: true
    default: 120
  support_type:
  - llm
  provider_category: manufacturer
execution:
  python:
    path: ./catalog_requester.py
    attr: ElevenLabsTTSRequester
