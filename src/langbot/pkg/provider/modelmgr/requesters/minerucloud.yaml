apiVersion: v1
kind: LLMAPIRequester
metadata:
  name: mineru-cloud
  label:
    en_US: MinerU (Cloud)
    zh_Hans: MinerU（云端）
  icon: openai.svg
spec:
  config:
  - name: base_url
    label:
      en_US: Base URL
      zh_Hans: 基础 URL
    type: string
    required: true
    default: https://mineru.net/api/v4
  - name: timeout
    label:
      en_US: Timeout
      zh_Hans: 超时时间
    type: integer
    required: true
    default: 600
  support_type:
  - pdf-parse
  provider_category: maas
execution:
  python:
    path: ./catalog_requester.py
    attr: MinerUCloudRequester
