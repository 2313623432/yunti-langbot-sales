apiVersion: v1
kind: LLMAPIRequester
metadata:
  name: paddleocr-vl
  label:
    en_US: PaddleOCR-VL
    zh_Hans: PaddleOCR-VL
  icon: openai.svg
spec:
  config:
  - name: base_url
    label:
      en_US: Base URL
      zh_Hans: 基础 URL
    type: string
    required: true
    default: https://paddleocr.aistudio-app.com/api/v2/ocr/jobs
  - name: timeout
    label:
      en_US: Timeout
      zh_Hans: 超时时间
    type: integer
    required: true
    default: 600
  support_type:
  - pdf-parse
  provider_category: maas
execution:
  python:
    path: ./catalog_requester.py
    attr: PaddleOcrVlRequester
