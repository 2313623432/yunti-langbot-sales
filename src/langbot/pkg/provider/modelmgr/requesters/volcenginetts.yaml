apiVersion: v1
kind: LLMAPIRequester
metadata:
  name: volcengine-tts
  label:
    en_US: Volcengine Speech
    zh_Hans: 火山引擎语音
  icon: volcark.svg
spec:
  config:
  - name: base_url
    label:
      en_US: Base URL
      zh_Hans: 基础 URL
    type: string
    required: true
    default: https://openspeech.bytedance.com
  - name: timeout
    label:
      en_US: Timeout
      zh_Hans: 超时时间
    type: integer
    required: true
    default: 120
  support_type:
  - llm
  provider_category: maas
execution:
  python:
    path: ./catalog_requester.py
    attr: VolcengineTTSRequester
